[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-runtime"
version = "0.1.0"
description = "Strict prepared VPN gateway, validation, and fail-closed SOCKS5 runtime."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = [
    "PyYAML>=6,<7",
    "pytest>=9,<10",
]

[project.scripts]
vpn-runtime-control = "vpn_runtime.control:control_main"
vpn-runtime-daemon = "vpn_runtime.control:daemon_main"
vpn-runtime-readiness = "vpn_runtime.control:readiness_main"
vpn-runtime-validate = "vpn_runtime.validation:main"

[tool.setuptools.packages.find]
include = ["vpn_runtime*"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.black]
target-version = ["py314"]
line-length = 120
